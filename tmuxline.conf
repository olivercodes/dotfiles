# tmux statusbar.
#
# Originally generated by tmuxline.vim on Tue, 26 Apr 2016, then hand-converted
# to modern syntax. tmux 2.9 removed the separate `-fg` / `-bg` / `-attr`
# options in favor of combined `-style` options, so the generated version had
# been erroring on every tmux startup. The colors themselves are unchanged.
#
# Not regenerating this with :TmuxlineSnapshot — tmuxline.vim still emits the
# pre-2.9 syntax, and vim-airline (which it themed) is gone in the Lua config.

set -g status "on"
set -g status-justify "left"
set -g status-style "none,bg=colour234"

set -g status-left ""
set -g status-left-length "100"
set -g status-left-style "none"

set -g status-right "#[fg=colour235,bg=colour252] %H:%M "
set -g status-right-length "100"
set -g status-right-style "none"

set -g message-style "fg=colour231,bg=colour25"
set -g message-command-style "fg=colour231,bg=colour25"

set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour254"

setw -g window-status-style "none,fg=colour250,bg=colour234"
setw -g window-status-activity-style "none,fg=colour250,bg=colour234"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour239,bg=colour234] #I #[fg=colour239,bg=colour234]#W "
setw -g window-status-current-format "#[fg=colour234,bg=colour25,nobold,nounderscore,noitalics]#[fg=colour231,bg=colour25,bold] #W #[fg=colour25,bg=colour234,nobold,nounderscore,noitalics]"
