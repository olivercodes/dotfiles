unbind C-a
unbind C-b

# -------------------------------------
#  Terminal / color
# -------------------------------------

# Ghostty is a truecolor terminal and nvim sets `termguicolors`, but tmux only
# passes 24-bit color through if it is told the outer terminal supports it.
# The old `screen-256color` silently downgraded everything to 256 colors.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a

# Initializes TMUX plugin manager.
run-shell '~/.tmux/plugins/tpm/tpm'

# Ring the bell if any background window rang a bell
set -g bell-action any

# Watch for activity in background windows
setw -g monitor-activity on

set-option -g set-titles on
set-option -g allow-rename on
set-option -g renumber-windows on

# Ghostty supports OSC 52, so tmux can put text on the macOS clipboard directly —
# including over ssh. This was `off` when the terminal couldn't be trusted to
# handle it; leaving it on means yanks inside nested/remote sessions work too.
set-option -s set-clipboard on

# Scrollback. Ghostty keeps its own large buffer, but once tmux is attached it
# owns the screen, so this is the number that actually matters.
set -g history-limit 50000

# Keep your finger on ctrl, or don't
bind-key ^D detach-client
bind-key ^C new-window

unbind s
unbind v

bind-key s split-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"

unbind a
unbind j
bind-key C-a select-pane -t :.+
bind C-k send-keys C-l \; clear-history
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key b select-window -t :-
bind-key n select-window -t :+
bind-key g choose-tree

# macOS only
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"




# https://bbs.archlinux.org/viewtopic.php?pid=1572476#p1572476

bind -n WheelUpPane   select-pane -t= \; copy-mode -e \; send-keys -M
bind -n WheelDownPane select-pane -t= \;                 send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M

# Keeps `jk` in nvim insert mode and `bindkey -v` in zsh from feeling laggy.
set -sg escape-time 0

# Let nvim see the terminal's focus events (used for 'autoread' and gitsigns).
set -g focus-events on

# set first window to index 1 (not 0) to map more to the keyboard layout...
set -g base-index 1
setw -g pane-base-index 1

# reload tmux config
unbind r
bind r \
    source-file ~/.tmux.conf \;\
    display 'Reloaded tmux config.'

set -g mouse on

# Toggle mouse on
bind m \
    set -g mouse on \;\
    display 'Mouse: ON'

# Toggle mouse off
bind M \
    set -g mouse off \;\
    display 'Mouse: OFF'

# NOTE: `set -g xterm-keys on` used to live here. It was removed in tmux 3.5
# (the behavior is now always on) and errors on startup if left in.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

source-file ~/.tmuxline.conf
